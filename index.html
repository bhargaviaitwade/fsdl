<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
</head>
<body>

<h1>My Tasks</h1>
<ul id="taskList"></ul>

<script>
fetch('http://localhost:3000/tasks')
  .then(res => res.json())
  .then(data => {
    const list = document.getElementById('taskList');
    data.forEach(task => {
      const li = document.createElement('li');
      li.textContent = task.title;
      list.appendChild(li);
    });
  });
</script>

</body>
</html>
